path:
  ckpt_path: Telugu/checkpoints
  log_path: Results/Telugu/logs
  result_path: Results/Telugu/test_generated_audios
optimizer:
  batch_size: 16
  betas: [0.9, 0.98]
  eps: 1.0e-09
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  warm_up_step: 1000
  anneal_steps: []
  anneal_rate: 0.3
step:
  # Pilot budget; increase only after the data pipeline and short run are verified.
  total_step: 5000
  log_step: 100
  synth_step: 1000
  val_step: 500
  save_step: 1000
